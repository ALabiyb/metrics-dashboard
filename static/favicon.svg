<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="12" fill="#080B11"/>
  <!-- bar chart representing metrics/NOC -->
  <rect x="8"  y="40" width="9" height="16" rx="2" fill="#22d3ee" opacity="0.55"/>
  <rect x="21" y="30" width="9" height="26" rx="2" fill="#22d3ee" opacity="0.75"/>
  <rect x="34" y="18" width="9" height="38" rx="2" fill="#22d3ee" filter="url(#glow)"/>
  <rect x="47" y="26" width="9" height="30" rx="2" fill="#22d3ee" opacity="0.75"/>
</svg>
