# EXAMPLE ONLY — do not apply this file as-is, and never commit real secrets
# to git. Generate the real Secret imperatively instead (see README.md
# § Authentication / Deploying to Kubernetes), e.g.:
#
#   HASH_ADMIN=$(docker run --rm k8s-ceph-dashboard:latest hash-password 'change-me-admin')
#   HASH_VIEWER=$(docker run --rm k8s-ceph-dashboard:latest hash-password 'change-me-viewer')
#   SESSION_SECRET=$(openssl rand -base64 32)
#
#   kubectl create secret generic dashboard-auth -n dashboard \
#     --from-literal=DASHBOARD_USERS="[
#       {\"username\":\"admin\",\"password_hash\":\"${HASH_ADMIN}\",\"role\":\"admin\"},
#       {\"username\":\"viewer\",\"password_hash\":\"${HASH_VIEWER}\",\"role\":\"viewer\"}
#     ]" \
#     --from-literal=SESSION_SECRET="${SESSION_SECRET}"
#
# The shape below is just so you can see what the Secret looks like once
# created (values are placeholders — these specific hashes/secret are public
# and MUST NOT be used for anything real).
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-auth
  namespace: dashboard
type: Opaque
stringData:
  DASHBOARD_USERS: |
    [
      {"username": "admin",  "password_hash": "$2a$10$REPLACE.WITH.YOUR.OWN.BCRYPT.HASH.....................", "role": "admin"},
      {"username": "viewer", "password_hash": "$2a$10$REPLACE.WITH.YOUR.OWN.BCRYPT.HASH.....................", "role": "viewer"}
    ]
  SESSION_SECRET: "REPLACE-WITH-A-RANDOM-32-BYTE-STRING-eg-openssl-rand--base64-32"
  EMBED_TOKEN: "REPLACE-WITH-RANDOM-TOKEN-eg-openssl-rand--hex-32"
  OIDC_CLIENT_SECRET: "REPLACE-WITH-YOUR-KEYCLOAK-CLIENT-SECRET-FOR-metrics-dashboard"
  # Optional — only needed if enabling Keycloak SSO (see README.md §
  # Authentication / run-guide.md § 6). Uncomment the matching
  # OIDC_CLIENT_SECRET entry in k8s/deployment.yaml's env block too.
  # OIDC_CLIENT_SECRET: "REPLACE-WITH-YOUR-KEYCLOAK-CLIENT-SECRET" 
